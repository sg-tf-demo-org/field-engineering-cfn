AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Secure S3 bucket with KMS CMK encryption (cross-stack import from aiden-kms-key-dev),
  full PublicAccessBlock, versioning, Object Lock, access logging, SSL enforcement,
  replication, and bucket policies that enforce aws:kms encryption on all PutObject calls.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:

  # Access logs bucket - receives server access logs from the primary secure bucket
  S3AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !ImportValue aiden-kms-key-dev-KeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: !Ref Environment

  S3AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt S3AccessLogsBucket.Arn
              - !Sub '${S3AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowS3LogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${S3AccessLogsBucket.Arn}/*'

  # Replication destination bucket
  S3ReplicationDestBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !ImportValue aiden-kms-key-dev-KeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: replication-dest/
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: !Ref Environment

  S3ReplicationDestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3ReplicationDestBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt S3ReplicationDestBucket.Arn
              - !Sub '${S3ReplicationDestBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Managed policy for S3 replication role (no inline policies per governance)
  S3ReplicationManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-S3ReplicationPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SourceBucketRead
            Effect: Allow
            Action:
              - s3:GetReplicationConfiguration
              - s3:ListBucket
              - s3:GetObjectVersionForReplication
              - s3:GetObjectVersionAcl
              - s3:GetObjectVersionTagging
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::*'
          - Sid: DestBucketWrite
            Effect: Allow
            Action:
              - s3:ReplicateObject
              - s3:ReplicateDelete
              - s3:ReplicateTags
            Resource: !Sub '${S3ReplicationDestBucket.Arn}/*'
          - Sid: KMSDecryptEncrypt
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !ImportValue aiden-kms-key-dev-KeyArn

  # IAM Role for S3 cross-region replication
  S3ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref S3ReplicationManagedPolicy
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: !Ref Environment

  # Primary secure S3 bucket
  SecureS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !ImportValue aiden-kms-key-dev-KeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: secure-s3-bucket/
      ReplicationConfiguration:
        Role: !GetAtt S3ReplicationRole.Arn
        Rules:
          - Id: ReplicateAll
            Status: Enabled
            Prefix: ''
            Destination:
              Bucket: !GetAtt S3ReplicationDestBucket.Arn
              EncryptionConfiguration:
                ReplicaKmsKeyID: !ImportValue aiden-kms-key-dev-KeyArn
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: !Ref Environment

  # Bucket policy: enforce SSL-only + KMS encryption on all PutObject calls
  SecureS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SecureS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SecureS3Bucket.Arn
              - !Sub '${SecureS3Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyNonKMSPutObject
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${SecureS3Bucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyNonKMSKeyPutObject
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${SecureS3Bucket.Arn}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'true'

Outputs:
  BucketName:
    Description: Name of the secure S3 bucket
    Value: !Ref SecureS3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN of the secure S3 bucket
    Value: !GetAtt SecureS3Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'
