# Placeholder — Aiden opens MRs under cloudformation/demo/<slug>/template.yaml
AWSTemplateFormatVersion: "2010-09-09"
Description: Placeholder only. Real templates land via Aiden MR.
Resources:
  PlaceholderBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: ManagedBy
          Value: aiden
