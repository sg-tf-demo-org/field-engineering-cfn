AWSTemplateFormatVersion: '2010-09-09'
Description: intentional FAIL
Resources:
  BadBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
  BadSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: bad
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  BadUser:
    Type: AWS::IAM::User
  BadKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref BadUser
Outputs:
  KeyId:
    Value: !Ref BadKey
