AWSTemplateFormatVersion: "2010-09-09"
Description: Brownfield — checkout (SQS + DLQ + DynamoDB + IAM); DLQ redrive maxReceiveCount=5

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, stage, uat, prod]
  Owner:
    Type: String
    Default: platform
  CostCenter:
    Type: String
    Default: FE-DEMO

Resources:
  OrderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aiden-checkout-dlq-${Environment}
      KmsMasterKeyId: alias/aws/sqs

      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aiden
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AppStack
          Value: checkout

  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aiden-checkout-orders-${Environment}
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderDLQ.Arn
        maxReceiveCount: 5

      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aiden
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AppStack
          Value: checkout

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aiden-checkout-orders-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aiden
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AppStack
          Value: checkout

  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub aiden-checkout-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [ecs-tasks.amazonaws.com, ec2.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CheckoutAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: [!GetAtt OrderQueue.Arn, !GetAtt OrderDLQ.Arn]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt OrdersTable.Arn

      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: aiden
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: AppStack
          Value: checkout

Outputs:
  OrderQueueUrl:
    Value: !Ref OrderQueue
  OrderDLQUrl:
    Value: !Ref OrderDLQ
  OrdersTableName:
    Value: !Ref OrdersTable
