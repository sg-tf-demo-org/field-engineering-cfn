AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Customer-managed KMS key with annual rotation for the platform FE-DEMO dev S3 bucket.
  Bucket is encrypted with SSE-KMS referencing this key. Owner=platform CostCenter=FE-DEMO Environment=dev.

Resources:

  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for platform demo bucket (key rotation enabled)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: dev

  KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/platform-fe-demo-dev
      TargetKeyId: !Ref KMSKey

  PlatformDemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt KMSKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Owner
          Value: platform
        - Key: CostCenter
          Value: FE-DEMO
        - Key: Environment
          Value: dev

Outputs:
  KMSKeyId:
    Description: KMS Key ID
    Value: !Ref KMSKey
    Export:
      Name: !Sub "${AWS::StackName}-KMSKeyId"
  KMSKeyArn:
    Description: KMS Key ARN
    Value: !GetAtt KMSKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KMSKeyArn"
  BucketName:
    Description: S3 Bucket Name
    Value: !Ref PlatformDemoBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"
